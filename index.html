<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<meta name="description" content="霓虹拳魂 NEON FIST SOUL —— 横板像素街机清版动作游戏">
<title>霓虹拳魂 NEON FIST SOUL</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="540" aria-label="霓虹拳魂 游戏画面"></canvas>

  <div id="touch-ui" class="hidden">
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-ring"></div><div id="stick-knob"></div></div>
    </div>
    <div id="buttons">
      <button class="tbtn tbtn-special" id="btn-special" data-action="special" aria-label="必杀">必杀</button>
      <button class="tbtn tbtn-heavy" id="btn-heavy" data-action="heavy" aria-label="重击">重</button>
      <button class="tbtn tbtn-attack" id="btn-attack" data-action="attack" aria-label="攻击">攻</button>
      <button class="tbtn tbtn-jump" id="btn-jump" data-action="jump" aria-label="跳跃">跳</button>
    </div>
  </div>

  <div id="topbar">
    <button id="btn-mute" class="topbtn" title="声音开关" aria-label="声音开关">♪</button>
    <button id="btn-pause" class="topbtn" title="暂停" aria-label="暂停">❚❚</button>
    <button id="btn-fullscreen" class="topbtn" title="全屏" aria-label="全屏">⛶</button>
  </div>

  <div id="rotate-tip"><b>请横屏游玩</b><span>旋转设备，或点击右上角全屏</span></div>
  <div id="error-box" class="hidden"></div>
</div>

<!-- 引擎与数据：加载顺序即依赖顺序（全部为普通脚本，支持 file:// 双击打开） -->
<script src="src/config.js"></script>
<script src="src/utils.js"></script>
<script src="src/assets.js"></script>

<!-- 美术资源清单（由美术模块生成） -->
<script src="assets/chars/hero/manifest.js"></script>
<script src="assets/chars/enemies/manifest.js"></script>
<script src="assets/world/manifest.js"></script>

<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/camera.js"></script>
<script src="src/render.js"></script>
<script src="src/stage.js"></script>
<script src="src/fx.js"></script>
<script src="src/hud.js"></script>
<script src="src/player.js"></script>
<script src="src/enemies.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
